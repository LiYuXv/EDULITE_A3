# Kinematics configuration for the EL-A3 arm.
#
# KDL is shipped with MoveIt 2 on ROS 2 Humble.  It is the supported baseline
# for this configuration and handles the active SRDF chain
# base_link -> l5_l6_urdf_asm plus the fixed TCP offset. Do not change
# this to Pick IK unless the `pick_ik` package/plugin has been installed and
# its FK->IK round-trip test passes on the deployed Humble installation.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_attempts: 3
